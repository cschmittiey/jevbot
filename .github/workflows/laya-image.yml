name: laya image

# the laya-serve image only. upstream publishes no registry image of its own, so
# this is what lets `docker compose pull` work, and it is torch-sized (~2GB):
# building it on every push would be waste, so it only runs when its definition
# changes, on tags, or on demand.
on:
  push:
    branches: [master]
    paths:
      - 'deploy/laya/**'
      - '.github/workflows/laya-image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'deploy/laya/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # pip's torch download dominates, and the arm64 leg runs under qemu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-laya
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: deploy/laya
          # same reasoning as the bot image: arm64 so an apple silicon host runs
          # it natively, since containers never see MPS
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
