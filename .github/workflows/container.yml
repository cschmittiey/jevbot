name: container

# builds the bot image only. laya-serve is a separate, torch-sized image that
# upstream already publishes, so it isn't rebuilt here.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check jev_bot.py parses
        run: python3 -m py_compile jev_bot.py

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # only trusted context values are interpolated here (repo slug, actor,
      # event name), never event payload text
      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 for apple silicon and graviton, amd64 for x86 servers.
          # the image is pure python, so qemu emulation only pays for pip's wheels.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
